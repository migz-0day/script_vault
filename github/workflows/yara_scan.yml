name: YARA Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master"]

jobs:
  yara-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y yara

      - name: Validate YARA syntax and scan repo
        run: |
          echo "Running YARA against repository..."
          yara -r -s security.yar .
